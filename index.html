<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0877d9"><title>MedNurse Game 2.0</title>
<style>
:root{--b:#0877d9;--b2:#24a6ff;--ink:#12304d;--bg:#eef7ff;--ok:#16a085;--gold:#f7b928;--red:#e85d5d;--purple:#7357d9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}
.app{max-width:520px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 30px #0001}header{background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;padding:18px;border-radius:0 0 24px 24px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:15px;background:#fff;color:var(--b);display:grid;place-items:center;font-size:25px;font-weight:900}
h1{font-size:23px;margin:0}h2{font-size:20px}.tag{font-size:13px;opacity:.9}main{padding:16px 16px 92px}.card{background:#fff;border:1px solid #dcecf8;border-radius:17px;padding:16px;margin:10px 0;box-shadow:0 4px 14px #0b477d0d}
.grid{display:grid;gap:11px}.btn{width:100%;border:0;border-radius:14px;padding:15px;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.blue{background:var(--b)}.green{background:var(--ok)}.gold{background:var(--gold)}.purple{background:var(--purple)}.red{background:var(--red)}
.muted{color:#69839a;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{background:#e9f6ff;color:var(--b);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}.option{width:100%;text-align:left;background:#fff;border:2px solid #dcecf8;border-radius:13px;padding:14px;margin:6px 0;font-size:15px}.correct{border-color:#19a66d!important;background:#eafff5!important}.wrong{border-color:#e45c5c!important;background:#fff0f0!important}
.barbg{height:10px;background:#e6eef4;border-radius:10px;overflow:hidden}.bar{height:100%;background:var(--b)}.score{text-align:center;font-size:40px;font-weight:900;color:var(--b)}
input{width:100%;padding:13px;border:1px solid #cfe1ef;border-radius:12px;font-size:15px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #dbeaf5;padding:7px 4px env(safe-area-inset-bottom);z-index:5}.nav button{border:0;background:none;color:#718ba1;font-weight:700;padding:7px;font-size:11px}.nav .active{color:var(--b)}.subject{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid #dfedf7;border-radius:15px;margin:8px 0}.icon{width:42px;height:42px;border-radius:12px;background:#e8f5ff;display:grid;place-items:center;font-size:22px}.hidden{display:none}.badge{display:inline-block;padding:8px 10px;background:#fff6d9;border-radius:12px;margin:4px;font-size:12px}.shop{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #e5eef4}

.install-btn{display:none;background:#fff;color:#0877d9;border:0;border-radius:12px;padding:10px 12px;font-weight:800;margin-top:10px}
.install-btn.show{display:block}.toast{position:fixed;left:50%;bottom:75px;transform:translateX(-50%);background:#12304d;color:#fff;padding:12px 16px;border-radius:12px;display:none;z-index:20;max-width:90%;text-align:center}
</style></head>
<body><div class="app"><header id="head"></header><main id="main"></main><div id="toast" class="toast"></div>
<div class="nav"><button onclick="home()">🏠<br>Home</button><button onclick="subjects()">🎮<br>Play</button><button onclick="study()">📚<br>Study</button><button onclick="profile()">👤<br>Profile</button></div></div>
<script>
const Q={
"Anatomy & Physiology":[["Which organ pumps blood around the body?","Heart",["Heart","Liver","Lung","Kidney"]],["What is the main function of the lungs?","Gas exchange",["Digestion","Gas exchange","Urine formation","Blood clotting"]],["Which structure connects muscle to bone?","Tendon",["Ligament","Tendon","Cartilage","Neuron"]],["Which organ produces bile?","Liver",["Pancreas","Liver","Kidney","Spleen"]]],
"Fundamentals of Nursing":[["First step of the nursing process?","Assessment",["Planning","Assessment","Evaluation","Implementation"]],["Which vital sign measures arterial pressure?","Blood pressure",["Pulse","Respiration","Blood pressure","Temperature"]],["Hand hygiene mainly prevents:","Transmission of infection",["Dehydration","Transmission of infection","Anemia","Pain"]],["A sterile technique aims to prevent:","Microbial contamination",["Hunger","Microbial contamination","Fever","Fatigue"]]],
"Pharmacology":[["Gentamicin belongs to which antibiotic class?","Aminoglycosides",["Macrolides","Aminoglycosides","Tetracyclines","Penicillins"]],["A drug that reduces fever is:","Antipyretic",["Antacid","Antipyretic","Anticoagulant","Antiemetic"]],["Which route delivers medicine directly into a vein?","Intravenous",["Oral","Intramuscular","Intravenous","Subcutaneous"]],["A drug's movement through the body is called:","Pharmacokinetics",["Pharmacodynamics","Pharmacokinetics","Toxicology","Pathology"]]],
"Medical-Surgical Nursing":[["A common symptom of hypoglycemia is:","Sweating",["Sweating","Jaundice","Constipation","Cyanosis"]],["Asthma primarily affects:","Breathing",["Hearing","Breathing","Vision","Digestion"]],["Inflammation of a vein with a thrombus is:","Thrombophlebitis",["Nephritis","Thrombophlebitis","Gastritis","Dermatitis"]]],
"Maternal & Child Health":[["Which hormone helps maintain pregnancy?","Progesterone",["Insulin","Progesterone","Thyroxine","Adrenaline"]],["Normal implantation occurs in the:","Uterine lining",["Cervix","Uterine lining","Ovary","Vagina"]],["Apgar scoring is commonly done after:","Birth",["Birth","One year","Puberty","Conception"]]],
"Mental Health Nursing":[["Loss of interest or pleasure is:","Anhedonia",["Euphoria","Anhedonia","Delusion","Echolalia"]],["A false fixed belief is a:","Delusion",["Delusion","Hallucination","Phobia","Compulsion"]],["An excessive irrational fear is a:","Phobia",["Phobia","Apathy","Confusion","Amnesia"]]],
"Nutrition":[["Main immediate energy source?","Carbohydrate",["Vitamin","Carbohydrate","Mineral","Water"]],["Vitamin important for clotting?","Vitamin K",["Vitamin K","Vitamin C","Vitamin B12","Vitamin D"]],["Kwashiorkor is strongly associated with deficiency of:","Protein",["Protein","Water","Vitamin C","Iodine"]]],
"Community Health":[["A measure that helps prevent malaria is:","Using insecticide-treated nets",["Sharing needles","Using insecticide-treated nets","Skipping meals","Avoiding exercise"]],["Primary prevention aims to:","Prevent disease before it occurs",["Treat complications","Prevent disease before it occurs","Diagnose only","Provide rehabilitation"]],["Immunization is an example of:","Primary prevention",["Primary prevention","Tertiary prevention","Rehabilitation","Palliative care"]]]
};
let S=JSON.parse(localStorage.getItem("mng2")||'{"name":"Nursing Student","points":0,"correct":0,"answered":0,"streak":0,"best":0,"lives":3,"coins":0,"daily":"","dailyDone":false,"sound":true}');
let subj="",qs=[],i=0,time=30,timer;
function save(){localStorage.setItem("mng2",JSON.stringify(S))}
function beep(ok=true){if(!S.sound)return;try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=ok?720:220;o.connect(g);g.connect(a.destination);g.gain.value=.06;o.start();o.stop(a.currentTime+.12)}catch(e){}}
function head(title="MedNurse Game",back=false){document.getElementById("head").innerHTML=`<div class="brand">${back?"<button style='background:none;border:0;color:white;font-size:30px' onclick='home()'>‹</button>":""}<div class="logo">♥</div><div><h1>${title}</h1><div class="tag">Learn • Play • Become Better</div><button id="install" class="install-btn">📲 Install MedNurse Game</button></div></div>`}
function home(){head();document.getElementById("main").innerHTML=`<div class="card"><div class="row"><div><h2>Welcome, ${S.name}! 🩺</h2><div class="muted">Level ${Math.floor(S.points/100)+1} • ${S.points} XP • 🪙 ${S.coins}</div></div><span class="pill">❤️ ${S.lives}</span></div></div>
<div class="grid"><button class="btn blue" onclick="subjects()">🎮 PLAY QUIZ<br><small>Earn points and streaks</small></button><button class="btn green" onclick="study()">📖 STUDY NURSING<br><small>Quick revision notes</small></button><button class="btn gold" onclick="daily()">🔥 DAILY CHALLENGE<br><small>One challenge every day</small></button><button class="btn purple" onclick="leader()">🏆 LEADERBOARD<br><small>Compete for the top</small></button></div>
<div class="card"><b>🏅 Your achievements</b><div><span class="badge">🌱 First Quiz</span><span class="badge">🔥 Streak ${S.best}</span><span class="badge">⭐ ${S.points} XP</span></div></div>`}
function subjects(){head("Choose a Subject",true);let icons=["🫀","👩‍⚕️","💊","🩺","👶","🧠","🍎","🌍"];document.getElementById("main").innerHTML="<h2>Nursing Subjects</h2>"+Object.keys(Q).map((x,n)=>`<div class="subject" onclick='start(${JSON.stringify(x)})'><div class="icon">${icons[n]}</div><div><b>${x}</b><div class="muted">${Q[x].length} questions</div></div></div>`).join("")}
function start(x){if(S.lives<=0){alert("No lives left. Your lives will refresh when you return later.");return}subj=x;qs=[...Q[x]].sort(()=>Math.random()-.5);i=0;question()}
function question(){clearInterval(timer);time=30;head(subj,true);let q=qs[i];document.getElementById("main").innerHTML=`<div class="row"><span class="pill">Question ${i+1}/${qs.length}</span><span class="pill" id="tm">⏱ ${time}s</span></div><div class="barbg" style="margin:13px 0"><div class="bar" style="width:${i/qs.length*100}%"></div></div><div class="card"><div style="font-size:19px;font-weight:800;line-height:1.4">${q[0]}</div></div><div id="ops">${q[2].map(a=>`<button class="option" onclick='answer(${JSON.stringify(a)})'>${a}</button>`).join("")}</div><div id="fb"></div>`;timer=setInterval(()=>{time--;document.getElementById("tm").textContent="⏱ "+time+"s";if(time<=0)answer(null)},1000)}
function answer(a){if(document.querySelector(".correct,.wrong"))return;clearInterval(timer);let q=qs[i],ok=a===q[1];document.querySelectorAll(".option").forEach(b=>{if(b.textContent===q[1])b.classList.add("correct");if(a&&a!==q[1]&&b.textContent===a)b.classList.add("wrong")});S.answered++;if(ok){beep(true);S.correct++;S.streak++;let pts=10+(S.streak>=3?5:0);S.points+=pts;S.coins+=2}else{beep(false);S.streak=0;S.lives=Math.max(0,S.lives-1)}S.best=Math.max(S.best,S.streak);save();document.getElementById("fb").innerHTML=`<div class="card">${ok?"✅ Correct!":"❌ Incorrect."} The answer is <b>${q[1]}</b>.<br><span class="muted">+${ok?10+(S.streak>=3?5:0):0} XP • ❤️ ${S.lives} lives</span></div><button class="btn blue" onclick='next()'>${i===qs.length-1?"Finish":"Next"}</button>`}
function next(){i++;if(i>=qs.length)finish();else question()}
function finish(){head("Quiz Complete",true);document.getElementById("main").innerHTML=`<div class="card" style="text-align:center"><div style="font-size:55px">🏆</div><h2>Excellent work!</h2><div class="score">${S.points}</div><div class="muted">Total XP</div><p>Accuracy: <b>${Math.round(S.correct/S.answered*100)}%</b></p><p>Best streak: 🔥 <b>${S.best}</b></p><button class="btn blue" onclick="subjects()">Play Again</button></div>`}
function daily(){let d=new Date().toISOString().slice(0,10);if(S.daily===d&&S.dailyDone){head("Daily Challenge",true);document.getElementById("main").innerHTML='<div class="card"><h2>✅ Completed!</h2><p>Come back tomorrow for a new challenge.</p></div>';return}S.daily=d;S.dailyDone=false;save();let keys=Object.keys(Q),x=keys[Math.floor(Math.random()*keys.length)];subj=x;qs=[Q[x][Math.floor(Math.random()*Q[x].length)]];i=0;question();S.dailyDone=true;save()}
function study(){head("Study Nursing",true);document.getElementById("main").innerHTML=`<h2>Quick Revision</h2><div class="card"><h3>🫁 Respiratory System</h3><p>The respiratory system brings oxygen into the body and removes carbon dioxide. Major structures include the nose, pharynx, larynx, trachea, bronchi and lungs.</p></div><div class="card"><h3>👩‍⚕️ Nursing Process</h3><p><b>Assessment → Diagnosis → Planning → Implementation → Evaluation.</b></p></div><div class="card"><h3>💊 Medication Safety</h3><p>Check the patient, medication, dose, route, time and relevant safety requirements before administration.</p></div><div class="card"><h3>🧠 Mental Health</h3><p>Delusion is a false fixed belief. Hallucination is a perception without an external stimulus. Anhedonia is loss of interest or pleasure.</p></div>`}
function leader(){head("Leaderboard",true);document.getElementById("main").innerHTML=`<h2>Leaderboard</h2><div class="card"><p>🥇 NurseQueen — 8,750</p><p>🥈 SmartNurse — 7,980</p><p>🥉 MedStudent — 6,420</p><p>🏅 <b>${S.name} — ${S.points}</b></p></div><div class="card"><b>🌐 Multiplayer</b><p class="muted">Online multiplayer requires a server/account system. This version keeps the interface ready for that upgrade.</p></div>`}
function profile(){head("My Profile",true);document.getElementById("main").innerHTML=`<div class="card"><h2>👤 ${S.name}</h2><input id="nm" value="${S.name}" maxlength="30"><button class="btn blue" style="margin-top:10px" onclick="rename()">Save Name</button></div><div class="card"><h3>⚙️ Settings</h3><label><input type="checkbox" ${S.sound?"checked":""} onchange="S.sound=this.checked;save()"> Sound effects</label></div><div class="card"><h3>💰 Rewards & Monetization</h3><p class="muted">The production version can use optional ads and approved in-app purchases. This test version has no real payments.</p><div class="shop"><span>🪙 100 coins</span><b>Coming later</b></div></div>`}
function rename(){let n=document.getElementById("nm").value.trim();if(n){S.name=n;save();home()}}
home();

let deferredInstall=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;let b=document.getElementById("install");if(b){b.classList.add("show");b.onclick=async()=>{deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;b.classList.remove("show")}}});
window.addEventListener("appinstalled",()=>{let b=document.getElementById("install");if(b)b.classList.remove("show");toast("MedNurse Game installed on your phone! 🎉")});
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",2800)}
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
